<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expert Light - Accounting & Billing</title>
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b1c3c">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; }
        .app-container { max-width: 480px; margin: 0 auto; background: #ffffff; min-height: 100vh; box-shadow: 0 4px 20px rgba(0,0,0,0.1); position: relative; padding-bottom: 70px; }
    </style>
</head>
<body class="bg-gray-100 flex justify-center">

<div class="app-container flex flex-col justify-between">

    <!-- Top Header with Expert Light Branding & Logo Theme -->
    <header class="bg-[#0b1c3c] text-white px-4 py-3 shadow-md border-b-4 border-amber-400">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <!-- App Logo Image -->
                <img src="icon-192.png" alt="Logo" class="w-11 h-11 rounded-xl object-cover shadow-lg border border-amber-400">
                <div>
                    <h1 class="font-bold text-base tracking-wide text-amber-300 flex items-center gap-1.5">
                        EXPERT LIGHT <i class="fa-solid fa-bolt text-xs text-amber-400"></i>
                    </h1>
                    <p class="text-[11px] text-gray-300 font-medium">Electrical & Lighting | Retail & Wholesale</p>
                </div>
            </div>
            <button id="installBtn" onclick="installApp()" class="bg-amber-400 text-[#0b1c3c] px-3 py-1.5 rounded-lg text-xs font-bold shadow hidden hover:bg-amber-300 transition flex items-center gap-1">
                <i class="fa-solid fa-download"></i> Install App
            </button>
        </div>

        <!-- Tabs -->
        <div class="flex mt-3 border-b border-gray-700">
            <button class="flex-1 pb-2 text-center font-semibold border-b-4 border-amber-400 text-amber-300 text-sm">
                ગ્રાહકો (Customers)
            </button>
            <button class="flex-1 pb-2 text-center text-gray-300 hover:text-white text-sm">
                સપ્લાયર (Suppliers)
            </button>
        </div>
    </header>

    <!-- Financial Summary Banner -->
    <div class="bg-white border-b shadow-sm p-3 grid grid-cols-2 gap-2 text-center">
        <div class="bg-red-50 p-2.5 rounded-xl border border-red-100">
            <p class="text-xs text-gray-500 font-medium">તમારી ચુકવણી (You'll Give)</p>
            <p id="totalGive" class="text-lg font-bold text-red-600">₹ 0</p>
        </div>
        <div class="bg-green-50 p-2.5 rounded-xl border border-green-100">
            <p class="text-xs text-gray-500 font-medium">તમારી ઉઘરાણી (You'll Get)</p>
            <p id="totalGet" class="text-lg font-bold text-green-600">₹ 0</p>
        </div>
        <div class="col-span-2 bg-amber-50 py-2 rounded-xl text-amber-900 text-xs font-semibold flex items-center justify-center gap-1.5 cursor-pointer hover:bg-amber-100 border border-amber-200">
            <i class="fa-solid fa-file-pdf text-amber-700"></i> રિપોર્ટ જુઓ & WhatsApp મોકલો (View Report)
        </div>
    </div>

    <!-- Search & Filters -->
    <div id="searchBarContainer" class="p-3 bg-gray-50 flex items-center gap-2 border-b">
        <div class="relative flex-1">
            <i class="fa-solid fa-search absolute left-3 top-3 text-gray-400 text-sm"></i>
            <input type="text" id="searchInput" onkeyup="filterParties()" placeholder="ગ્રાહક શોધો (Search customer)..." class="w-full pl-9 pr-3 py-2 bg-white border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#0b1c3c]">
        </div>
        <button class="px-3 py-2 bg-white border border-gray-300 rounded-xl text-gray-700 text-sm flex items-center gap-1 hover:bg-gray-100">
            <i class="fa-solid fa-filter text-xs"></i> ફિલ્ટર
        </button>
    </div>

    <!-- Main Content Area: Dynamic View Container -->
    <div id="mainViewContainer" class="flex-1 overflow-y-auto">
        <div id="partyListContainer" class="divide-y divide-gray-100"></div>
    </div>

    <!-- Floating Action Button: + ગ્રાહક ઉમેરો -->
    <div class="fixed bottom-16 left-0 right-0 flex justify-center z-10 pointer-events-none">
        <div class="max-w-[480px] w-full px-4 flex justify-end">
            <button onclick="openAddPartyModal()" class="pointer-events-auto bg-[#0b1c3c] hover:bg-[#152e59] text-white px-5 py-3 rounded-full shadow-xl flex items-center gap-2 font-semibold text-sm transition transform hover:scale-105 border-2 border-amber-400">
                <i class="fa-solid fa-user-plus text-amber-400 text-base"></i> + ગ્રાહક ઉમેરો
            </button>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto bg-white border-t border-gray-200 flex justify-around py-2 z-20 text-xs text-gray-600 shadow-lg">
        <button onclick="switchTab('parties')" id="nav-parties" class="flex flex-col items-center text-[#0b1c3c] font-bold">
            <i class="fa-solid fa-users text-lg mb-0.5 text-amber-500"></i>
            <span>પાર્ટીઓ</span>
        </button>
        <button onclick="switchTab('bills')" id="nav-bills" class="flex flex-col items-center hover:text-[#0b1c3c]">
            <i class="fa-solid fa-file-invoice text-lg mb-0.5"></i>
            <span>બિલ</span>
        </button>
        <button onclick="switchTab('items')" id="nav-items" class="flex flex-col items-center hover:text-[#0b1c3c]">
            <i class="fa-solid fa-lightbulb text-lg mb-0.5"></i>
            <span>લાઇટ આઇટમ</span>
        </button>
        <button onclick="switchTab('more')" id="nav-more" class="flex flex-col items-center hover:text-[#0b1c3c]">
            <i class="fa-solid fa-ellipsis text-lg mb-0.5"></i>
            <span>વધુ</span>
        </button>
    </nav>

</div>

<!-- Modal: Add Party / Customer -->
<div id="addPartyModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
            <h3 class="font-bold text-lg text-gray-800 flex items-center gap-2">
                <i class="fa-solid fa-bolt text-amber-500"></i> નવો ગ્રાહક ઉમેરો
            </h3>
            <button onclick="closeAddPartyModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <div class="space-y-3">
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">ગ્રાહકનું નામ (Customer Name)</label>
                <input type="text" id="partyNameInput" placeholder="Enter name..." class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-[#0b1c3c] focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">WhatsApp નંબર (Mobile Number)</label>
                <input type="text" id="partyPhoneInput" placeholder="9876543210" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-[#0b1c3c] focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">રકમ (Amount in ₹)</label>
                <input type="number" id="partyAmountInput" placeholder="500" value="500" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-[#0b1c3c] focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">પ્રકાર (Type)</label>
                <select id="partyTypeInput" class="w-full px-3 py-2 border rounded-xl text-sm bg-white focus:outline-none">
                    <option value="get">તમે લેવાના છે (You'll Get)</option>
                    <option value="give">તમે આપવાના છે (You'll Give)</option>
                </select>
            </div>
            <div class="pt-3 flex gap-2">
                <button onclick="closeAddPartyModal()" class="flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-xl text-sm font-semibold">રદ કરો</button>
                <button onclick="saveNewParty()" class="flex-1 bg-[#0b1c3c] text-white py-2.5 rounded-xl text-sm font-semibold border border-amber-400">સેવ કરો</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal: Party Details, Delete Record & WhatsApp Direct Send -->
<div id="partyDetailModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl">
        <div class="flex justify-between items-center mb-3 border-b pb-2">
            <div>
                <h3 id="detailPartyName" class="font-bold text-lg text-gray-800">Customer Name</h3>
                <p id="detailPartyPhone" class="text-xs text-gray-500">Phone</p>
            </div>
            <button onclick="closePartyDetailModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <div class="bg-gray-50 p-3.5 rounded-xl my-3 flex justify-between items-center border">
            <span class="text-sm font-medium text-gray-600">બૅલેન્સ (Balance):</span>
            <span id="detailPartyBalance" class="text-base font-bold">₹ 500</span>
        </div>
        <div class="space-y-3 mb-4">
            <!-- Direct WhatsApp Message Button -->
            <button onclick="sendWhatsAppMessage()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 shadow-md">
                <i class="fa-brands fa-whatsapp text-lg"></i> WhatsApp પર મેસેજ મોકલો (Send on WhatsApp)
            </button>
            <!-- Delete Record Button -->
            <button onclick="deleteCurrentParty()" class="w-full bg-red-50 hover:bg-red-100 text-red-600 py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 border border-red-200">
                <i class="fa-solid fa-trash"></i> રેકોર્ડ કાઢી નાખો (Delete Record)
            </button>
        </div>
        <button onclick="closePartyDetailModal()" class="w-full bg-gray-200 text-gray-700 py-2 rounded-xl text-sm font-semibold">બંધ કરો</button>
    </div>
</div>

<script>
    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
            .then(() => console.log('Service Worker Registered Successfully'))
            .catch((err) => console.log('Service Worker Registration Failed:', err));
    }

    // Install prompt handler
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('installBtn').classList.remove('hidden');
    });

    function installApp() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    console.log('User accepted the install prompt');
                }
                deferredPrompt = null;
                document.getElementById('installBtn').classList.add('hidden');
            });
        }
    }

    // Data stored with localStorage persistence
    let parties = JSON.parse(localStorage.getItem('expert_light_parties')) || [
        { id: 1, name: "Rajesh Electricals", phone: "9876543210", amount: 2500, type: "get", time: "હમણાં જ" },
        { id: 2, name: "Patel Light House", phone: "9123456789", amount: 1200, type: "give", time: "1 કલાક પહેલા" }
    ];

    let selectedPartyId = null;
    let currentTab = 'parties';

    function saveToLocalStorage() {
        localStorage.setItem('expert_light_parties', JSON.stringify(parties));
    }

    function renderParties() {
        const container = document.getElementById('partyListContainer');
        if (!container) return;
        container.innerHTML = '';
        
        let totalGiveVal = 0;
        let totalGetVal = 0;

        parties.forEach(party => {
            if (party.type === 'give') totalGiveVal += party.amount;
            else totalGetVal += party.amount;

            const amountColor = party.type === 'give' ? 'text-red-600' : 'text-green-600';
            const html = `
                <div onclick="openPartyDetails(${party.id})" class="flex items-center justify-between p-3.5 hover:bg-amber-50/50 cursor-pointer transition">
                    <div class="flex items-center gap-3">
                        <div class="w-11 h-11 rounded-xl bg-[#0b1c3c] text-amber-400 font-bold flex items-center justify-center text-base shadow">
                            ${party.name.charAt(0)}
                        </div>
                        <div>
                            <h4 class="font-semibold text-gray-800 text-sm">${party.name}</h4>
                            <p class="text-xs text-gray-400 flex items-center gap-1.5 mt-0.5">
                                <i class="fa-solid fa-phone text-gray-400 text-[10px]"></i> ${party.phone}
                            </p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="font-bold text-sm ${amountColor}">₹ ${party.amount}</p>
                        <span class="text-[10px] text-gray-500 font-medium">${party.type === 'give' ? "આપવાના" : "લેવાના"}</span>
                    </div>
                </div>
            `;
            container.innerHTML += html;
        });

        document.getElementById('totalGive').innerText = `₹ ${totalGiveVal}`;
        document.getElementById('totalGet').innerText = `₹ ${totalGetVal}`;
    }

    function filterParties() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const container = document.getElementById('partyListContainer');
        if (!container) return;
        container.innerHTML = '';

        const filtered = parties.filter(p => p.name.toLowerCase().includes(query) || p.phone.includes(query));
        filtered.forEach(party => {
            const amountColor = party.type === 'give' ? 'text-red-600' : 'text-green-600';
            const html = `
                <div onclick="openPartyDetails(${party.id})" class="flex items-center justify-between p-3.5 hover:bg-amber-50/50 cursor-pointer transition">
                    <div class="flex items-center gap-3">
                        <div class="w-11 h-11 rounded-xl bg-[#0b1c3c] text-amber-400 font-bold flex items-center justify-center text-base shadow">
                            ${party.name.charAt(0)}
                        </div>
                        <div>
                            <h4 class="font-semibold text-gray-800 text-sm">${party.name}</h4>
                            <p class="text-xs text-gray-400 flex items-center gap-1.5 mt-0.5">
                                <i class="fa-solid fa-phone text-gray-400 text-[10px]"></i> ${party.phone}
                            </p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="font-bold text-sm ${amountColor}">₹ ${party.amount}</p>
                        <span class="text-[10px] text-gray-500 font-medium">${party.type === 'give' ? "આપવાના" : "લેવાના"}</span>
                    </div>
                </div>
            `;
            container.innerHTML += html;
        });
    }

    function openAddPartyModal() {
        document.getElementById('addPartyModal').classList.remove('hidden');
    }

    function closeAddPartyModal() {
        document.getElementById('addPartyModal').classList.add('hidden');
    }

    function saveNewParty() {
        const name = document.getElementById('partyNameInput').value.trim();
        const phone = document.getElementById('partyPhoneInput').value.trim();
        const amount = parseFloat(document.getElementById('partyAmountInput').value) || 0;
        const type = document.getElementById('partyTypeInput').value;

        if (!name) {
            alert('કૃપા કરીને ગ્રાહકનું નામ દાખલ કરો.');
            return;
        }

        const newParty = {
            id: Date.now(),
            name: name,
            phone: phone || '9876543210',
            amount: amount,
            type: type,
            time: 'હમણાં જ'
        };

        parties.unshift(newParty);
        saveToLocalStorage();
        
        // Switch back to parties tab and render so saved record shows immediately
        switchTab('parties');
        closeAddPartyModal();

        document.getElementById('partyNameInput').value = '';
        document.getElementById('partyPhoneInput').value = '';
        document.getElementById('partyAmountInput').value = '500';
    }

    function openPartyDetails(id) {
        selectedPartyId = id;
        const party = parties.find(p => p.id === id);
        if (!party) return;

        document.getElementById('detailPartyName').innerText = party.name;
        document.getElementById('detailPartyPhone').innerText = `Mobile / WhatsApp: ${party.phone}`;
        document.getElementById('detailPartyBalance').innerText = `₹ ${party.amount} (${party.type === 'give' ? "આપવાના છે" : "લેવાના છે"})`;
        document.getElementById('partyDetailModal').classList.remove('hidden');
    }

    function closePartyDetailModal() {
        document.getElementById('partyDetailModal').classList.add('hidden');
        selectedPartyId = null;
    }

    function deleteCurrentParty() {
        if (selectedPartyId === null) return;
        if (confirm('શું તમે આ રેકોર્ડ કાયમ માટે કાઢી નાખવા માંગો છો? (Are you sure you want to delete this record?)')) {
            parties = parties.filter(p => p.id !== selectedPartyId);
            saveToLocalStorage();
            closePartyDetailModal();
            renderParties();
        }
    }

    function sendWhatsAppMessage() {
        const party = parties.find(p => p.id === selectedPartyId);
        if (!party) return;

        const jamaVal = party.type === 'get' ? party.amount : 0;
        const bakiVal = party.type === 'give' ? party.amount : 0;

        const message = `💡 EXPERT LIGHT
Electrical & Lighting | Retail & Wholesale
━━━━━━━━━━━━━━━━━━━━
🙏 નમસ્તે ${party.name},

આપનો ખાતાવહી હિસાબ નીચે મુજબ છે:
🟢 કુલ જમા (Jama): ₹${jamaVal}
🔴 કુલ બાકી (Baki): ₹${bakiVal}
━━━━━━━━━━━━━━━━━━━━
💰 રકમ: ₹${party.amount}
📅 તારીખ: 16/10/2026

કોઈપણ પ્રશ્ન માટે અમારો સંપર્ક કરો.
આભાર! ⚡`;

        let phoneNum = party.phone.replace(/[^0-9]/g, '');
        if (phoneNum.length === 10) {
            phoneNum = '91' + phoneNum;
        }

        const whatsappUrl = `https://wa.me/${phoneNum}?text=${encodeURIComponent(message)}`;
        window.open(whatsappUrl, '_blank');
    }

    function switchTab(tab) {
        currentTab = tab;
        ['parties', 'bills', 'items', 'more'].forEach(t => {
            const btn = document.getElementById(`nav-${t}`);
            if (t === tab) {
                btn.className = "flex flex-col items-center text-[#0b1c3c] font-bold";
            } else {
                btn.className = "flex flex-col items-center text-gray-600 hover:text-[#0b1c3c]";
            }
        });

        const mainContainer = document.getElementById('mainViewContainer');
        const searchContainer = document.getElementById('searchBarContainer');

        if (tab === 'parties') {
            searchContainer.style.display = 'flex';
            mainContainer.innerHTML = `<div id="partyListContainer" class="divide-y divide-gray-100"></div>`;
            renderParties();
        } else if (tab === 'bills') {
            searchContainer.style.display = 'none';
            mainContainer.innerHTML = `<div class="p-8 text-center text-gray-500">
                <i class="fa-solid fa-file-invoice text-4xl mb-2 text-amber-500"></i>
                <p class="font-semibold text-gray-800">Expert Light Bills & Invoices</p>
                <p class="text-xs text-gray-400 mt-1">Wholesale & retail billing records will appear here.</p>
            </div>`;
        } else if (tab === 'items') {
            searchContainer.style.display = 'none';
            mainContainer.innerHTML = `<div class="p-6 space-y-3">
                <div class="bg-white p-3.5 rounded-xl shadow-sm border flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-amber-100 text-amber-700 flex items-center justify-center font-bold">💡</div>
                        <div>
                            <h4 class="font-semibold text-sm text-gray-800">LED Bulbs & Lights</h4>
                            <p class="text-xs text-gray-400">Wholesale Stock</p>
                        </div>
                    </div>
                    <span class="text-xs font-bold text-green-600">In Stock</span>
                </div>
                <div class="bg-white p-3.5 rounded-xl shadow-sm border flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-amber-100 text-amber-700 flex items-center justify-center font-bold">🔌</div>
                        <div>
                            <h4 class="font-semibold text-sm text-gray-800">Electrical Wires & Switches</h4>
                            <p class="text-xs text-gray-400">Retail & Wholesale</p>
                        </div>
                    </div>
                    <span class="text-xs font-bold text-green-600">In Stock</span>
                </div>
            </div>`;
        } else if (tab === 'more') {
            searchContainer.style.display = 'none';
            mainContainer.innerHTML = `<div class="p-4 space-y-3">
                <div class="bg-white p-3.5 rounded-xl shadow-sm border flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-store text-amber-600 text-lg"></i>
                        <div>
                            <span class="text-sm font-medium text-gray-800 block">EXPERT LIGHT</span>
                            <span class="text-xs text-gray-400">Electrical & Lighting | Retail & Wholesale</span>
                        </div>
                    </div>
                    <span class="text-xs bg-amber-100 text-amber-800 px-2 py-1 rounded-lg font-semibold">Verified</span>
                </div>
                <div class="bg-white p-3.5 rounded-xl shadow-sm border flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <i class="fa-brands fa-whatsapp text-emerald-600 text-xl"></i>
                        <span class="text-sm font-medium text-gray-800">Direct WhatsApp Messaging</span>
                    </div>
                    <span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded font-semibold">Enabled</span>
                </div>
            </div>`;
        }
    }

    renderParties();
</script>

</body>
</html>
