<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhataBook - Keep Your Records Bright</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; }
        .app-container { max-width: 480px; margin: 0 auto; background: #ffffff; min-height: 100vh; box-shadow: 0 4px 20px rgba(0,0,0,0.1); position: relative; padding-bottom: 70px; }
    </style>
</head>
<body class="bg-gray-100 flex justify-center">

<div class="app-container flex flex-col justify-between">

    <!-- Top Header (Matches Blue App Header in Screenshot 1 & Logo Theme) -->
    <header class="bg-[#0b3c5d] text-white px-4 py-3 shadow-md">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <!-- Logo representation -->
                <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center shadow">
                    <span class="text-[#0b3c5d] font-bold text-xl">K</span>
                </div>
                <div>
                    <h1 class="font-bold text-lg flex items-center gap-2">
                        મારો બિઝનેસ <i class="fa-solid fa-pen text-xs opacity-75"></i>
                    </h1>
                    <p class="text-xs text-blue-200">દુકાનનું સ્થાન ઉમેરો (Rajkot, Gujarat)</p>
                </div>
            </div>
            <button onclick="openSettingsModal()" class="text-white hover:text-yellow-300">
                <i class="fa-solid fa-gear text-xl"></i>
            </button>
        </div>

        <!-- Tabs: ગ્રાહકો (Customers) & સપ્લાયર (Suppliers) -->
        <div class="flex mt-3 border-b border-blue-400">
            <button class="flex-1 pb-2 text-center font-semibold border-b-4 border-yellow-400 text-white">
                ગ્રાહકો (Customers)
            </button>
            <button class="flex-1 pb-2 text-center text-blue-200 hover:text-white">
                સપ્લાયર (Suppliers)
            </button>
        </div>
    </header>

    <!-- Financial Summary Banner (Matches Screenshot 1) -->
    <div class="bg-white border-b shadow-sm p-3 grid grid-cols-2 gap-2 text-center">
        <div class="bg-red-50 p-2 rounded-lg border border-red-100">
            <p class="text-xs text-gray-500 font-medium">તમારી ચુકવણી (You'll Give)</p>
            <p id="totalGive" class="text-lg font-bold text-red-600">₹ 500</p>
        </div>
        <div class="bg-green-50 p-2 rounded-lg border border-green-100">
            <p class="text-xs text-gray-500 font-medium">તમારી ઉઘરાણી (You'll Get)</p>
            <p id="totalGet" class="text-lg font-bold text-green-600">₹ 0</p>
        </div>
        <div class="col-span-2 bg-blue-50 py-2 rounded-lg text-blue-800 text-xs font-semibold flex items-center justify-center gap-1 cursor-pointer hover:bg-blue-100">
            <i class="fa-solid fa-file-pdf"></i> રિપોર્ટ જુઓ (View Report)
        </div>
    </div>

    <!-- Search & Filters -->
    <div class="p-3 bg-gray-50 flex items-center gap-2 border-b">
        <div class="relative flex-1">
            <i class="fa-solid fa-search absolute left-3 top-3 text-gray-400 text-sm"></i>
            <input type="text" id="searchInput" onkeyup="filterParties()" placeholder="ગ્રાહક શોધો (Search customer)..." class="w-full pl-9 pr-3 py-2 bg-white border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#0b3c5d]">
        </div>
        <button class="px-3 py-2 bg-white border border-gray-300 rounded-lg text-gray-700 text-sm flex items-center gap-1 hover:bg-gray-100">
            <i class="fa-solid fa-filter text-xs"></i> ફિલ્ટર
        </button>
        <button class="px-3 py-2 bg-white border border-gray-300 rounded-lg text-blue-600 text-sm font-medium flex items-center gap-1 hover:bg-gray-100">
            <i class="fa-solid fa-book-open"></i> કેશબુક
        </button>
    </div>

    <!-- Main Content Area: Party List -->
    <div id="partyListContainer" class="flex-1 overflow-y-auto divide-y divide-gray-100">
        <!-- Dynamically populated party items -->
    </div>

    <!-- Floating Action Button: + ગ્રાહક ઉમેરો (Add Customer) -->
    <div class="fixed bottom-16 left-0 right-0 flex justify-center z-10 pointer-events-none">
        <div class="max-w-[480px] w-full px-4 flex justify-end">
            <button onclick="openAddPartyModal()" class="pointer-events-auto bg-[#b91c5c] hover:bg-[#9d154e] text-white px-5 py-3 rounded-full shadow-lg flex items-center gap-2 font-semibold text-sm transition transform hover:scale-105">
                <i class="fa-solid fa-user-plus text-base"></i> + ગ્રાહક ઉમેરો
            </button>
        </div>
    </div>

    <!-- Bottom Navigation Bar (Matches Screenshot 1 Footer) -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto bg-white border-t border-gray-200 flex justify-around py-2 z-20 text-xs text-gray-600">
        <button onclick="switchTab('parties')" id="nav-parties" class="flex flex-col items-center text-[#0b3c5d] font-semibold">
            <i class="fa-solid fa-users text-lg mb-0.5"></i>
            <span>પાર્ટીઓ</span>
        </button>
        <button onclick="switchTab('bills')" id="nav-bills" class="flex flex-col items-center hover:text-[#0b3c5d]">
            <i class="fa-solid fa-file-invoice text-lg mb-0.5"></i>
            <span>બિલ</span>
        </button>
        <button onclick="switchTab('items')" id="nav-items" class="flex flex-col items-center hover:text-[#0b3c5d]">
            <i class="fa-solid fa-boxes-stacked text-lg mb-0.5"></i>
            <span>આઇટમો</span>
        </button>
        <button onclick="switchTab('more')" id="nav-more" class="flex flex-col items-center hover:text-[#0b3c5d]">
            <i class="fa-solid fa-ellipsis text-lg mb-0.5"></i>
            <span>વધુ</span>
        </button>
    </nav>

</div>

<!-- Modal: Add Party / Customer -->
<div id="addPartyModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-sm w-full p-5 shadow-2xl">
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold text-lg text-gray-800">નવો ગ્રાહક ઉમેરો (Add Customer)</h3>
            <button onclick="closeAddPartyModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <div class="space-y-3">
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">ગ્રાહકનું નામ (Customer Name)</label>
                <input type="text" id="partyNameInput" placeholder="Enter name..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-[#0b3c5d] focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">મોબાઈલ નંબર (Mobile Number)</label>
                <input type="text" id="partyPhoneInput" placeholder="Enter phone..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-[#0b3c5d] focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">રકમ (Amount in ₹)</label>
                <input type="number" id="partyAmountInput" placeholder="500" value="500" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-[#0b3c5d] focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">પ્રકાર (Type)</label>
                <select id="partyTypeInput" class="w-full px-3 py-2 border rounded-lg text-sm bg-white focus:outline-none">
                    <option value="give">તમે આપવાના છે (You'll Give)</option>
                    <option value="get">તમે લેવાના છે (You'll Get)</option>
                </select>
            </div>
            <div class="pt-3 flex gap-2">
                <button onclick="closeAddPartyModal()" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg text-sm font-semibold">રદ કરો</button>
                <button onclick="saveNewParty()" class="flex-1 bg-[#0b3c5d] text-white py-2 rounded-lg text-sm font-semibold">સેવ કરો</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal: Party Details & Delete Record Option -->
<div id="partyDetailModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-sm w-full p-5 shadow-2xl">
        <div class="flex justify-between items-center mb-3">
            <div>
                <h3 id="detailPartyName" class="font-bold text-lg text-gray-800">Customer Name</h3>
                <p id="detailPartyPhone" class="text-xs text-gray-500">Phone</p>
            </div>
            <button onclick="closePartyDetailModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <div class="bg-gray-50 p-3 rounded-lg my-3 flex justify-between items-center">
            <span class="text-sm font-medium text-gray-600">બૅલેન્સ (Balance):</span>
            <span id="detailPartyBalance" class="text-base font-bold">₹ 500</span>
        </div>
        <div class="space-y-2 text-sm text-gray-700 mb-4">
            <p class="flex items-center gap-2"><i class="fa-solid fa-clock text-blue-500"><span>8 સેકન્ડ પહેલા (Just now)</span></i></p>
        </div>
        <div class="flex gap-2">
            <button onclick="deleteCurrentParty()" class="flex-1 bg-red-100 text-red-600 py-2 rounded-lg text-sm font-semibold flex items-center justify-center gap-1 hover:bg-red-200">
                <i class="fa-solid fa-trash"></i> રેકોર્ડ કાઢી નાખો (Delete)
            </button>
            <button onclick="closePartyDetailModal()" class="flex-1 bg-[#0b3c5d] text-white py-2 rounded-lg text-sm font-semibold">બંધ કરો</button>
        </div>
    </div>
</div>

<script>
    // Initial Data matching user's screenshot
    let parties = [
        { id: 1, name: "ગ્રાહક ૧ (Customer 1)", phone: "9876543210", amount: 500, type: "give", time: "8 સેકન્ડ પહેલા" }
    ];

    let currentActiveTab = 'parties';
    let selectedPartyId = null;

    function renderParties() {
        const container = document.getElementById('partyListContainer');
        container.innerHTML = '';
        
        let totalGiveVal = 0;
        let totalGetVal = 0;

        parties.forEach(party => {
            if (party.type === 'give') totalGiveVal += party.amount;
            else totalGetVal += party.amount;

            const amountColor = party.type === 'give' ? 'text-red-600' : 'text-green-600';
            const html = `
                <div onclick="openPartyDetails(${party.id})" class="flex items-center justify-between p-3 hover:bg-gray-50 cursor-pointer transition">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-blue-100 text-[#0b3c5d] font-bold flex items-center justify-center text-sm">
                            ${party.name.charAt(0)}
                        </div>
                        <div>
                            <h4 class="font-semibold text-gray-800 text-sm">${party.name}</h4>
                            <p class="text-xs text-gray-400 flex items-center gap-1">
                                <i class="fa-solid fa-eye text-blue-600"></i> ${party.time}
                            </p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="font-bold text-sm ${amountColor}">₹ ${party.amount}</p>
                        <span class="text-[10px] text-gray-400">${party.type === 'give' ? "આપવાના" : "લેવાના"}</span>
                    </div>
                </div>
            `;
            container.innerHTML += html;
        });

        document.getElementById('totalGive').innerText = `₹ ${totalGiveVal}`;
        document.getElementById('totalGet').innerText = `₹ ${totalGetVal}`;
    }

    function filterParties() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const container = document.getElementById('partyListContainer');
        container.innerHTML = '';

        const filtered = parties.filter(p => p.name.toLowerCase().includes(query) || p.phone.includes(query));
        filtered.forEach(party => {
            const amountColor = party.type === 'give' ? 'text-red-600' : 'text-green-600';
            const html = `
                <div onclick="openPartyDetails(${party.id})" class="flex items-center justify-between p-3 hover:bg-gray-50 cursor-pointer transition">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-blue-100 text-[#0b3c5d] font-bold flex items-center justify-center text-sm">
                            ${party.name.charAt(0)}
                        </div>
                        <div>
                            <h4 class="font-semibold text-gray-800 text-sm">${party.name}</h4>
                            <p class="text-xs text-gray-400 flex items-center gap-1">
                                <i class="fa-solid fa-eye text-blue-600"></i> ${party.time}
                            </p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="font-bold text-sm ${amountColor}">₹ ${party.amount}</p>
                    </div>
                </div>
            `;
            container.innerHTML += html;
        });
    }

    function openAddPartyModal() {
        document.getElementById('addPartyModal').classList.remove('hidden');
    }

    function closeAddPartyModal() {
        document.getElementById('addPartyModal').classList.add('hidden');
    }

    function saveNewParty() {
        const name = document.getElementById('partyNameInput').value.trim();
        const phone = document.getElementById('partyPhoneInput').value.trim();
        const amount = parseFloat(document.getElementById('partyAmountInput').value) || 0;
        const type = document.getElementById('partyTypeInput').value;

        if (!name) {
            alert('कृपया ગ્રાહકનું નામ દાખલ કરો.');
            return;
        }

        const newParty = {
            id: Date.now(),
            name: name,
            phone: phone || 'નથી',
            amount: amount,
            type: type,
            time: 'હમણાં જ'
        };

        parties.unshift(newParty);
        renderParties();
        closeAddPartyModal();

        // Clear inputs
        document.getElementById('partyNameInput').value = '';
        document.getElementById('partyPhoneInput').value = '';
    }

    function openPartyDetails(id) {
        selectedPartyId = id;
        const party = parties.find(p => p.id === id);
        if (!party) return;

        document.getElementById('detailPartyName').innerText = party.name;
        document.getElementById('detailPartyPhone').innerText = `Mobile: ${party.phone}`;
        document.getElementById('detailPartyBalance').innerText = `₹ ${party.amount} (${party.type === 'give' ? "આપવાના" : "લેવાના"})`;
        document.getElementById('partyDetailModal').classList.remove('hidden');
    }

    function closePartyDetailModal() {
        document.getElementById('partyDetailModal').classList.add('hidden');
        selectedPartyId = null;
    }

    function deleteCurrentParty() {
        if (selectedPartyId === null) return;
        if (confirm('શું તમે આ રેકોર્ડ કાયમ માટે કાઢી નાખવા માંગો છો? (Are you sure you want to delete this record?)')) {
            parties = parties.filter(p => p.id !== selectedPartyId);
            renderParties();
            closePartyDetailModal();
        }
    }

    function switchTab(tab) {
        currentActiveTab = tab;
        ['parties', 'bills', 'items', 'more'].forEach(t => {
            const btn = document.getElementById(`nav-${t}`);
            if (t === tab) {
                btn.className = "flex flex-col items-center text-[#0b3c5d] font-semibold";
            } else {
                btn.className = "flex flex-col items-center text-gray-600 hover:text-[#0b3c5d]";
            }
        });

        const container = document.getElementById('partyListContainer');
        if (tab === 'parties') {
            renderParties();
        } else if (tab === 'bills') {
            container.innerHTML = `<div class="p-6 text-center text-gray-500">
                <i class="fa-solid fa-file-invoice text-4xl mb-2 text-gray-300"></i>
                <p class="font-semibold">કોઈ બિલ ઉપલબ્ધ નથી</p>
                <p class="text-xs text-gray-400 mt-1">બિલ જનરેટ કરવા માટે 'બિલ' સેクションનો ઉપયોગ કરો.</p>
            </div>`;
        } else if (tab === 'items') {
            container.innerHTML = `<div class="p-6 text-center text-gray-500">
                <i class="fa-solid fa-boxes-stacked text-4xl mb-2 text-gray-300"></i>
                <p class="font-semibold">કોઈ આઇટમ ઉપલબ્ધ નથી</p>
            </div>`;
        } else if (tab === 'more') {
            container.innerHTML = `<div class="p-4 space-y-3">
                <div class="bg-white p-3 rounded-lg shadow-sm border flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-shield-halved text-[#0b3c5d] text-lg"></i>
                        <span class="text-sm font-medium">બિઝનેસ સેટિંગ્સ</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
                </div>
                <div class="bg-white p-3 rounded-lg shadow-sm border flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-palette text-[#0b3c5d] text-lg"></i>
                        <span class="text-sm font-medium">थीम / Bright Records Light Theme</span>
                    </div>
                    <span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded font-semibold">Active</span>
                </div>
            </div>`;
        }
    }

    // Initial load
    renderParties();
</script>

</body>
</html>
